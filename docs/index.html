<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071a1e">
<title>Touladi — Maquette</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#071a1e;color:#EEF5F4;font-family:'Source Sans 3',system-ui,sans-serif}
.banner{padding:10px 16px;text-align:center;font-size:14px;line-height:1.35;background:#0B252B;border-bottom:1px solid rgba(255,255,255,0.12)}
.banner strong{font-family:'Barlow Condensed',sans-serif;letter-spacing:0.08em;font-size:16px}
.banner .privacy{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;font-size:13px;color:#9FE6DB}
.banner .privacy svg{flex-shrink:0}
#stage{display:flex;justify-content:center;padding:12px 0 24px}
#frame{position:relative;overflow:hidden;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
#app{width:390px;height:844px;transform-origin:top left}

body{margin:0}
a{color:#7FD6CA}a:hover{color:#FFFFFF}
:root{color-scheme:dark}
input::placeholder,textarea::placeholder{color:#8FA3A0}
select option{background:#0E2C33;color:#EEF5F4}
.ph-dore{background-image:url(photos/dore-jaune.jpg)}
.ph-touladi{background-image:url(photos/touladi.jpg)}
.ph-brochet{background-image:url(photos/grand-brochet.jpg)}
.ph-achigan{background-image:url(photos/achigan.jpg)}
.ph-perchaude{background-image:url(photos/perchaude.jpg)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

</style>
</head>
<body>
<div class="banner">Maquette interactive de <strong>TOULADI</strong> · données fictives, rien n'est enregistré.<span class="privacy"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Dans l'app, vos coordonnées GPS et toutes les informations compilées sont privées et restent sur votre téléphone. Aucun compte, aucun serveur. Pour la météo, seule une position arrondie (≈ 10 km) est envoyée.</span></div>
<div id="stage"><div id="frame"><div id="app"></div></div></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; position: relative; isolation: isolate; background: #0B252B; color: #EEF5F4; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 15px;">
<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; top: 0; left: 0; z-index: -1; pointer-events: none;">
<defs>
<radialGradient id="bgGlowA" cx="0.12" cy="0.1" r="0.6"><stop offset="0" stop-color="#2FA39A" stop-opacity="0.5"/><stop offset="1" stop-color="#2FA39A" stop-opacity="0"/></radialGradient>
<radialGradient id="bgGlowB" cx="0.92" cy="0.78" r="0.55"><stop offset="0" stop-color="#E2683A" stop-opacity="0.32"/><stop offset="1" stop-color="#E2683A" stop-opacity="0"/></radialGradient>
<radialGradient id="bgGlowC" cx="0.45" cy="0.5" r="0.7"><stop offset="0" stop-color="#1F5E7A" stop-opacity="0.6"/><stop offset="1" stop-color="#1F5E7A" stop-opacity="0"/></radialGradient>
</defs>
<rect width="390" height="844" fill="#0B252B"/>
<rect width="390" height="844" fill="url(#bgGlowC)"/>
<rect width="390" height="844" fill="url(#bgGlowA)"/>
<rect width="390" height="844" fill="url(#bgGlowB)"/>
<g fill="none" stroke="#9FE6DB" stroke-opacity="0.1" stroke-width="1.2">
<path d="M60 470 C90 360 240 330 320 400 C390 460 360 610 260 640 C160 670 40 600 60 470Z"/>
<path d="M95 480 C120 395 235 372 295 425 C350 472 325 585 250 605 C175 625 80 570 95 480Z"/>
<path d="M130 490 C150 430 230 412 272 450 C310 485 292 560 240 572 C188 585 118 545 130 490Z"/>
<path d="M165 498 C178 460 225 450 250 474 C272 496 262 535 232 542 C202 549 158 528 165 498Z"/>
<path d="M-40 120 C40 40 200 60 230 140 C255 210 160 260 60 250 C-20 242 -70 180 -40 120Z"/>
<path d="M-10 135 C50 80 175 92 198 148 C218 198 145 232 70 225 C10 219 -30 172 -10 135Z"/>
<path d="M25 148 C65 115 150 122 166 158 C180 190 130 210 82 205 C40 200 12 172 25 148Z"/>
<path d="M-30 760 C80 700 260 720 420 680"/>
<path d="M-30 795 C90 745 270 760 420 725"/>
</g>
</svg>

<header style="background: rgba(4,18,22,0.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #FFFFFF; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<div style="display: flex; align-items: center; gap: 10px;">
<svg width="40" height="40" viewBox="0 0 64 64" role="img" aria-label="Logo Touladi">
<defs><linearGradient id="hdrLg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A5560"/><stop offset="1" stop-color="#0A2328"/></linearGradient></defs>
<rect width="64" height="64" rx="15" fill="url(#hdrLg)"/>
<rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#9FE6DB" stroke-opacity="0.35"/>
<g fill="none" stroke="#7FD6CA" stroke-opacity="0.4" stroke-width="1.2"><path d="M8 50 C20 44 44 46 58 40"/><path d="M8 56 C22 51 42 53 58 48"/><path d="M10 14 C22 9 40 10 54 16"/></g>
<path d="M22 24.5 C25 19.5 30 19 33.5 21.5" fill="none" stroke="#F3E9DA" stroke-width="2.2" stroke-linecap="round"/>
<path d="M9 32 C15 23 31 20 42 27 L54 20 L50.5 32 L54 44 L42 37 C31 44 15 41 9 32 Z" fill="#F3E9DA"/>
<path d="M13 34.5 C20 39 32 39.5 41 35.5" fill="none" stroke="#E2683A" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="15" cy="30.5" r="1.7" fill="#0A2328"/>
<g fill="#B9A586"><circle cx="24" cy="28.5" r="1.2"/><circle cx="29" cy="32.5" r="1"/><circle cx="34" cy="28" r="1.2"/><circle cx="38.5" cy="32" r="0.9"/></g>
</svg>
<div style="display: flex; flex-direction: column;">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.14em; line-height: 1.1;">TOULADI</span>
<span style="font-size: 12px; color: #B8C7C4; white-space: nowrap;">Carnet de pêche du Québec</span>
</div>
</div>
<button onClick="{{goZone}}" aria-label="{{zoneLabel}}, hors ligne. Changer de zone" style="min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 0 10px; white-space: nowrap; flex-shrink: 0; background: transparent; border: 1px solid #3A5357; color: #D7E2E0;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7FC29B;"></span>{{zoneLabel}}</button>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
<sc-if value="{{showBack}}" hint-placeholder-val="{{false}}">
<button onClick="{{goBack}}" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #FFFFFF;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
</sc-if>
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05;">{{title}}</h1>
</div>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 96px; box-sizing: border-box;">

<!-- ============ CARNET ============ -->
<sc-if value="{{isCarnet}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<span style="font-size: 13px; font-weight: 600;">Version gratuite</span>
<span style="font-size: 13px; color: #A9BDB9;">{{used}} / 25 prises</span>
</div>
<div style="height: 6px; background: rgba(255,255,255,0.12);"><div style="height: 6px; background: #2E6B6E; width: {{usedPct}}%;"></div></div>
<button onClick="{{goPlus}}" style="align-self: flex-start; background: transparent; border: 0; padding: 4px 0; color: #FF9466; font-weight: 700; font-size: 14px;">Passer à Touladi Pro — achat unique</button>
</section>

<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="5">
<button onClick="{{chip.pick}}" style="flex-shrink: 0; min-height: 40px; padding: 0 14px; font-size: 14px; font-weight: 600; background: {{chip.bg}}; color: {{chip.fg}}; border: 1px solid {{chip.bd}};">{{chip.label}}</button>
</sc-for>
</div>

<sc-for list="{{shown}}" as="item" hint-placeholder-count="4">
<article style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); display: flex; flex-direction: column; overflow: hidden;">
<div class="{{item.phClass}}" role="img" aria-label="{{item.alt}}" style="width: 100%; height: 180px; flex-shrink: 0; background-color: {{item.tint}}; background-size: cover; background-position: {{item.phPos}}; display: flex; align-items: flex-end; padding: 6px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.18);"><sc-if value="{{item.noPhoto}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #F1F4F2;">PHOTO</span></sc-if></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 10px 12px 12px;">
<div style="display: flex; justify-content: space-between; gap: 8px;">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1;">{{item.species}}</span>
<sc-if value="{{item.released}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; color: #7FD6CA; border: 1px solid #2E6B6E; padding: 2px 6px; height: fit-content; white-space: nowrap;">Remis à l'eau</span></sc-if>
</div>
<span style="font-size: 15px; font-weight: 600;">{{item.size}}</span>
<span style="font-size: 13px; color: #A9BDB9;">{{item.lake}} · {{item.when}}</span>
<span style="font-size: 13px; color: #A9BDB9;">{{item.lure}}</span>
</div>
</article>
</sc-for>
<span style="font-size: 11px; color: #A9BDB9;">Photos d'exemple : iNaturalist — Quinn (CC BY), Lythronax246 (CC BY), Daughter Dad (CC BY).</span>
</div>
</sc-if>

<!-- ============ AJOUT ============ -->
<sc-if value="{{isAjout}}" hint-placeholder-val="{{false}}">
<form style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="sp-search" style="font-size: 13px; font-weight: 600;">Espèce</label>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.45); padding: 8px 12px;">
<span style="display: flex; align-items: center; gap: 10px; min-width: 0;"><sc-if value="{{spHasPhoto}}" hint-placeholder-val="{{true}}"><span class="{{spPhClass}}" role="img" aria-label="Photo : {{spFr}}" style="width: 56px; height: 56px; flex-shrink: 0; background-size: cover; background-position: {{spPhPos}}; border: 1px solid rgba(255,255,255,0.2);"></span></sc-if><span style="display: flex; flex-direction: column; min-width: 0;"><span style="font-weight: 700; font-size: 17px;">{{spFr}}</span><span style="font-size: 13px; font-style: italic; color: #A9BDB9;">{{spSci}}</span></span></span>
<span style="font-size: 12px; color: #A9BDB9; text-align: right;">{{spFam}}</span>
</div>
<input id="sp-search" type="search" value="{{spQuery}}" onChange="{{setSpQuery}}" placeholder="Chercher parmi {{spCount}} espèces (ex. truite mouchetée)" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
<sc-if value="{{spQueryEmpty}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #A9BDB9;">ESPÈCES SPORTIVES</span></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{spResults}}" as="r" hint-placeholder-count="10">
<button type="button" onClick="{{r.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{r.bg}}; color: {{r.fg}}; border: 1px solid {{r.bd}};">{{r.fr}}</button>
</sc-for>
</div>
<sc-if value="{{spNoResult}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #A9BDB9;">Aucune espèce trouvée. Effacez la recherche et choisissez « Espèce inconnue ».</span></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Longueur ({{lenUnit}})
<input type="number" inputmode="decimal" value="{{length}}" onChange="{{setLength}}" placeholder="{{phLen}}" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Poids ({{wUnit}})
<input type="number" inputmode="decimal" value="{{weight}}" onChange="{{setWeight}}" placeholder="{{phW}}" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Profondeur du fond ({{depthUnit}})
<input type="number" inputmode="decimal" value="{{depthVal}}" onChange="{{setDepth}}" placeholder="—" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Profondeur de pêche · facultatif
<input type="number" inputmode="decimal" value="{{fishDepth}}" onChange="{{setFishDepth}}" placeholder="poisson suspendu" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
</div>
<span style="display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #A9BDB9;"><span style="flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 6px; border: 1px solid {{depthSrc.bd}}; color: {{depthSrc.fg}}; background: {{depthSrc.bg}};">{{depthSrc.tag}}</span>{{depthSrc.text}}</span>
</div>
<div role="status" style="border: 1px solid {{rule.bd}}; background: {{rule.bg}}; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: {{rule.fg}};">{{rule.head}}</span>
<span style="font-size: 15px; font-weight: 700; color: {{rule.fg}};">{{rule.line1}}</span>
<span style="font-size: 13px; color: #EEF5F4;">{{rule.line2}}</span>
<button type="button" onClick="{{goRegl}}" style="align-self: flex-start; min-height: 36px; padding: 0; background: transparent; border: 0; color: #7FD6CA; font-size: 13px; font-weight: 700;">Voir tous les règlements de la zone</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Température de l'eau ({{tUnit}}) · facultatif
<input type="number" inputmode="decimal" value="{{water}}" onChange="{{setWater}}" placeholder="{{phT}}" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
<fieldset style="margin: 0; padding: 12px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); display: flex; flex-direction: column; gap: 12px; min-width: 0;">
<legend style="padding: 0 6px; font-size: 13px; font-weight: 700;">Technique et montage</legend>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-tech" style="font-size: 13px; font-weight: 600;">Technique</span>
<div role="group" aria-labelledby="lbl-tech" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{techs}}" as="t" hint-placeholder-count="7">
<button type="button" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.bd}};">{{t.label}}</button>
</sc-for>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Modèle (de mon équipement)
<select value="{{gearSel}}" onChange="{{setGear}}" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4;">
<option>Jig 1/4 oz + ver</option><option>Cuillère ondulante</option><option>Poisson-nageur articulé (2 hameçons triples)</option><option>Ménés morts</option><option>Mouche sèche</option><option>Autre montage</option>
</select>
</label>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-bait" style="font-size: 13px; font-weight: 600;">Appât ou leurre utilisé</span>
<div role="radiogroup" aria-labelledby="lbl-bait" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{baitOpts}}" as="b" hint-placeholder-count="7">
<button type="button" role="radio" aria-checked="{{b.on}}" onClick="{{b.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{b.bg}}; color: {{b.fg}}; border: 1px solid {{b.bd}};">{{b.label}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{baitIsFish}}" hint-placeholder-val="{{false}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Espèce utilisée comme appât
<select value="{{baitSp}}" onChange="{{setBaitSp}}" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4;">
<option>Méné (cyprin)</option><option>Meunier</option><option>Perchaude</option><option>Hareng</option><option>Capelan</option><option>Maquereau</option><option>Crevette</option>
</select>
</label>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-hooks" style="font-size: 13px; font-weight: 600;">Hameçons sur la ligne</span>
<div role="group" aria-labelledby="lbl-hooks" style="display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.22);">
<button type="button" aria-label="Retirer un hameçon" onClick="{{hooksDown}}" style="width: 44px; min-height: 44px; border: 0; background: rgba(255,255,255,0.10); font-size: 20px; font-weight: 700; color: #EEF5F4;">−</button>
<span style="flex: 1; text-align: center; font-size: 17px; font-weight: 700;">{{hooks}}</span>
<button type="button" aria-label="Ajouter un hameçon" onClick="{{hooksUp}}" style="width: 44px; min-height: 44px; border: 0; background: rgba(255,255,255,0.10); font-size: 20px; font-weight: 700; color: #EEF5F4;">+</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">

<sc-if value="{{isSauvegarde}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<section style="background: rgba(4,18,22,0.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #FFFFFF; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; color: #B8C7C4;">Dernière sauvegarde</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1;">{{bkHead}}</span>
<span style="font-size: 13px; color: #D7E2E0;">{{bkCounts}}</span>
<sc-if value="{{bkLate}}" hint-placeholder-val="{{true}}"><span style="align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; background: #C24F1C; color: #FFFFFF;">Sauvegarde en retard selon votre rappel</span></sc-if>
</section>

<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Sauvegarde complète</h2>
<span style="font-size: 13px; color: #A9BDB9;">Un seul fichier <strong>.touladi</strong> : tout le carnet, les spots, l'équipement, les dépenses et les photos. C'est le seul format qui permet de tout restaurer.</span>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px;"><input type="checkbox" checked="{{bkPhotos}}" onChange="{{toggleBkPhotos}}" style="width: 22px; height: 22px; accent-color: #7FD6CA; flex-shrink: 0;"/>Inclure les photos (31 photos)</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px;"><input type="checkbox" checked="{{bkPwOn}}" onChange="{{toggleBkPw}}" style="width: 22px; height: 22px; accent-color: #7FD6CA; flex-shrink: 0;"/>Protéger par un mot de passe</label>
<sc-if value="{{bkPwOn}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="bk-pw" style="font-size: 13px; font-weight: 600;">Mot de passe</label>
<input id="bk-pw" type="password" value="{{bkPw}}" onChange="{{setBkPw}}" autocomplete="new-password" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
<span style="font-size: 12px; color: #FFB08A;">Sans ce mot de passe, la sauvegarde ne peut pas être ouverte. Touladi ne peut pas le récupérer pour vous.</span>
</div>
</sc-if>
<button onClick="{{makeBackup}}" style="min-height: 52px; background: #C24F1C; color: #FFFFFF; border: 0; font-size: 16px; font-weight: 700;">Créer la sauvegarde · {{bkSize}}</button>
<sc-if value="{{bkMade}}" hint-placeholder-val="{{false}}">
<div role="status" style="background: rgba(127,214,202,0.13); border: 1px solid #2E6B6E; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 14px; font-weight: 700; color: #9FE6DB;">{{bkFile}} est prêt</span>
<span style="font-size: 13px;">{{bkMadeTxt}}</span>
</div>
</sc-if>
</section>

<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Rappel de sauvegarde</h2>
<div role="radiogroup" aria-label="Rappel de sauvegarde" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{bkReminds}}" as="o" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}};">{{o.label}}</button></sc-for>
</div>
<span style="font-size: 12px; color: #A9BDB9;">Sans serveur, la sauvegarde est votre seule protection si vous perdez votre téléphone. Les sauvegardes d'iCloud et de Google sont un filet de sécurité, mais Android peut y laisser de côté les photos.</span>
</section>

<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Restaurer</h2>
<sc-if value="{{rsIdle}}" hint-placeholder-val="{{true}}">
<button onClick="{{rsPick}}" style="min-height: 48px; background: transparent; border: 1px solid rgba(255,255,255,0.45); color: #EEF5F4; font-weight: 700; font-size: 15px;">Choisir un fichier .touladi</button>
</sc-if>
<sc-if value="{{rsPreview}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px;">
<span style="font-weight: 700; font-size: 15px;">touladi-2026-10-02.touladi</span>
<span style="font-size: 13px;">Sauvegardé le 2 oct. 2026 · Touladi 1.0 · schéma 3</span>
<span style="font-size: 13px;">148 prises · 3 spots · 29 photos · 14 articles · 6 dépenses</span>
</div>
<span style="font-size: 13px; color: #FFB08A; font-weight: 600;">Vos données actuelles seront remplacées. Une copie de sécurité est créée juste avant, pour pouvoir revenir en arrière.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<button onClick="{{rsCancel}}" style="min-height: 46px; background: transparent; border: 1px solid rgba(255,255,255,0.45); color: #EEF5F4; font-weight: 600; font-size: 14px;">Annuler</button>
<button onClick="{{rsConfirm}}" style="min-height: 46px; background: rgba(4,18,22,0.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 0; color: #FFFFFF; font-weight: 700; font-size: 14px;">Restaurer</button>
</div>
</div>
</sc-if>
<sc-if value="{{rsDone}}" hint-placeholder-val="{{false}}">
<div role="status" style="background: rgba(127,214,202,0.13); border: 1px solid #2E6B6E; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 14px; font-weight: 700; color: #9FE6DB;">Carnet restauré</span>
<span style="font-size: 13px;">Copie de sécurité conservée : {{rsSafety}}. Les données d'une ancienne version sont mises à jour automatiquement.</span>
<button onClick="{{rsCancel}}" style="align-self: flex-start; min-height: 36px; padding: 0; background: transparent; border: 0; color: #7FD6CA; font-weight: 700; font-size: 13px;">OK</button>
</div>
</sc-if>
</section>

<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Exporter vos données</h2>
<span style="font-size: 13px; color: #A9BDB9;">Pour Excel ou un autre logiciel. Ces fichiers ne servent pas à restaurer.</span>
<span id="lbl-csv" style="font-size: 13px; font-weight: 600;">Tableaux CSV</span>
<div role="group" aria-labelledby="lbl-csv" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{csvOpts}}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}};">{{o.label}}</button></sc-for>
</div>
<button onClick="{{exportCsv}}" style="min-height: 46px; background: transparent; border: 1px solid rgba(255,255,255,0.45); color: #EEF5F4; font-weight: 700; font-size: 14px;">{{csvLabel}}</button>
<div style="border-top: 1px solid rgba(255,255,255,0.10); padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 600;">Spots pour un GPS ou Google Earth</span>
<span style="font-size: 12px; color: #FFB08A;">Vos spots quitteront le téléphone : partagez ce fichier avec prudence.</span>
<button onClick="{{exportGpx}}" style="min-height: 46px; background: transparent; border: 1px solid rgba(255,255,255,0.45); color: #EEF5F4; font-weight: 700; font-size: 14px;">Exporter les 3 spots en GPX</button>
</div>
<sc-if value="{{hasExpMsg}}" hint-placeholder-val="{{false}}"><div role="status" style="background: rgba(127,214,202,0.13); border: 1px solid #2E6B6E; padding: 10px 12px; font-size: 13px;">{{expMsg}}</div></sc-if>
</section>
</div>
</sc-if>

<!-- ============ AJOUT ENTRETIEN ============ -->
<sc-if value="{{isAjoutEnt}}" hint-placeholder-val="{{false}}">
<form style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-mgear" style="font-size: 13px; font-weight: 600;">Équipement concerné</span>
<div role="radiogroup" aria-labelledby="lbl-mgear" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{meGears}}" as="g" hint-placeholder-count="6">
<button type="button" role="radio" aria-checked="{{g.on}}" onClick="{{g.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{g.bg}}; color: {{g.fg}}; border: 1px solid {{g.bd}};">{{g.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-mtask" style="font-size: 13px; font-weight: 600;">Tâche</span>
<span style="font-size: 12px; color: #A9BDB9;">Suggestions pour cet article : la fréquence habituelle se remplit toute seule.</span>
<div role="radiogroup" aria-labelledby="lbl-mtask" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{meTpls}}" as="t" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.bd}};">{{t.label}}</button>
</sc-for>
</div>
<sc-if value="{{meOther}}" hint-placeholder-val="{{false}}"><input type="text" aria-label="Tâche personnalisée" value="{{meTaskOther}}" onChange="{{setMeTaskOther}}" placeholder="ex. Changer les roulements" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-mmode" style="font-size: 13px; font-weight: 600;">Fréquence</span>
<div role="radiogroup" aria-labelledby="lbl-mmode" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid rgba(255,255,255,0.45);">
<sc-for list="{{meModes}}" as="u" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="min-height: 56px; border: 0; background: {{u.bg}}; color: {{u.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px;"><span style="font-weight: 700; font-size: 14px;">{{u.label}}</span><span style="font-size: 12px; color: {{u.sub}};">{{u.hint}}</span></button>
</sc-for>
</div>
</div>
<sc-if value="{{meIsCount}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
<span style="font-size: 14px; font-weight: 600;">{{meEveryWord}}</span>
<div role="group" aria-label="Intervalle" style="display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.22); width: 150px; background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);"><button type="button" aria-label="Diminuer" onClick="{{meNDown}}" style="width: 44px; min-height: 44px; border: 0; background: rgba(255,255,255,0.10); font-size: 20px; font-weight: 700; color: #EEF5F4;">−</button><span style="flex: 1; text-align: center; font-size: 17px; font-weight: 700;">{{meN}}</span><button type="button" aria-label="Augmenter" onClick="{{meNUp}}" style="width: 44px; min-height: 44px; border: 0; background: rgba(255,255,255,0.10); font-size: 20px; font-weight: 700; color: #EEF5F4;">+</button></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{meUnitChips}}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{o.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}};">{{o.label}}</button></sc-for>
</div>
<sc-if value="{{meIsUsage}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #A9BDB9;">Touladi compte vos sorties à partir du carnet et de la pêche blanche. Les heures de moteur se notent quand vous cochez « fait ».</span></sc-if>
</div>
</sc-if>
<sc-if value="{{meIsSeason}}" hint-placeholder-val="{{false}}">
<div role="radiogroup" aria-label="Moment de la saison" style="display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{meSeasons}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 52px; padding: 6px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid rgba(255,255,255,0.45);"><span style="font-weight: 700; font-size: 15px;">{{o.label}}</span><span style="font-size: 12px; color: {{o.sub}};">{{o.hint}}</span></button></sc-for>
</div>
</sc-if>
<sc-if value="{{meIsOnce}}" hint-placeholder-val="{{false}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Date
<input type="date" value="{{meDate}}" onChange="{{setMeDate}}" style="min-height: 46px; font-size: 16px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
</sc-if>
<div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 600;"><input type="checkbox" checked="{{meNotif}}" onChange="{{toggleMeNotif}}" style="width: 22px; height: 22px; accent-color: #7FD6CA; flex-shrink: 0;"/>Notification sur le téléphone</label>
<sc-if value="{{meShowRemind}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{meReminds}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}};">{{o.label}}</button></sc-for></div></sc-if>
<sc-if value="{{meIsUsage}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #A9BDB9;">Selon l'usage, le rappel s'affiche au début de la sortie où le seuil est atteint.</span></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: end;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Coût habituel ($)
<input type="number" inputmode="decimal" value="{{meCost}}" onChange="{{setMeCost}}" placeholder="facultatif" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 46px; font-size: 13px;"><input type="checkbox" checked="{{meCostExp}}" onChange="{{toggleMeCostExp}}" style="width: 22px; height: 22px; accent-color: #7FD6CA; flex-shrink: 0;"/>Ajouter aux dépenses quand c'est fait</label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Instructions · facultatif
<textarea rows="3" value="{{meNotes}}" onChange="{{setMeNotes}}" placeholder="ex. graisse marine sur les engrenages, 2 gouttes d'huile sur la manivelle" style="font-size: 16px; padding: 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; resize: none;"></textarea>
</label>
<div style="background: rgba(127,214,202,0.13); border: 1px solid rgba(127,214,202,0.35); padding: 10px 12px; font-size: 13px;"><span style="font-weight: 700; color: #9FE6DB;">Aperçu : </span>{{meSummary}}</div>
<button type="button" onClick="{{saveMaint}}" style="min-height: 52px; background: #C24F1C; color: #FFFFFF; border: 0; font-size: 17px; font-weight: 700;">Enregistrer l'entretien</button>
</form>
</sc-if>

<!-- ============ AJOUT DÉPENSE ============ -->
<sc-if value="{{isAjoutDep}}" hint-placeholder-val="{{false}}">
<form style="display: flex; flex-direction: column; gap: 14px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Montant total ($)
<input type="number" inputmode="decimal" value="{{deAmt}}" onChange="{{setDeAmt}}" placeholder="0,00" style="min-height: 60px; font-size: 28px; font-weight: 700; padding: 0 12px; border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-dcat" style="font-size: 13px; font-weight: 600;">Catégorie</span>
<div role="radiogroup" aria-labelledby="lbl-dcat" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{deCats}}" as="c" hint-placeholder-count="10">
<button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 4px 12px; text-align: left; font-size: 14px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.bd}};">{{c.label}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{deSubShow}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 13px; font-weight: 600;">{{deSubLabel}} · facultatif</span>
<sc-if value="{{deSubChips}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-wrap: wrap; gap: 6px;"><sc-for list="{{deSubOpts}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" style="min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.bd}};">{{o.label}}</button></sc-for></div></sc-if>
<sc-if value="{{deSubText}}" hint-placeholder-val="{{false}}"><input type="text" aria-label="{{deSubLabel}}" value="{{deText}}" onChange="{{setDeText}}" placeholder="{{deSubPh}}" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/></sc-if>
</div>
</sc-if>
<sc-if value="{{deIsEquip}}" hint-placeholder-val="{{false}}">
<div style="background: rgba(127,214,202,0.13); border: 1px solid rgba(127,214,202,0.35); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 13px;">Pour suivre la valeur d'un article et l'associer à vos prises, ajoutez-le plutôt dans Équipement : la dépense sera créée en même temps.</span>
<button type="button" onClick="{{goAjoutEquip}}" style="align-self: flex-start; min-height: 40px; padding: 0 12px; background: rgba(4,18,22,0.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #FFFFFF; border: 0; font-weight: 600; font-size: 14px;">Ajouter un article</button>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0;">Date
<input type="date" value="{{deDate}}" onChange="{{setDeDate}}" style="min-height: 46px; font-size: 16px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0;">Sortie liée
<select value="{{deTrip}}" onChange="{{setDeTrip}}" style="min-height: 46px; font-size: 16px; padding: 0 8px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; width: 100%;"><option>Aucune</option><option>11 oct. · Lac Kipawa</option><option>4 oct. · Lac Témiscamingue</option><option>Pêche blanche en cours</option></select>
</label>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-split" style="font-size: 13px; font-weight: 600;">Partagé entre</span>
<div style="display: flex; align-items: center; gap: 12px;">
<div role="group" aria-labelledby="lbl-split" style="display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.22); width: 160px; background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);"><button type="button" aria-label="Une personne de moins" onClick="{{splitDown}}" style="width: 44px; min-height: 44px; border: 0; background: rgba(255,255,255,0.10); font-size: 20px; font-weight: 700; color: #EEF5F4;">−</button><span style="flex: 1; text-align: center; font-size: 17px; font-weight: 700;">{{deSplit}}</span><button type="button" aria-label="Une personne de plus" onClick="{{splitUp}}" style="width: 44px; min-height: 44px; border: 0; background: rgba(255,255,255,0.10); font-size: 20px; font-weight: 700; color: #EEF5F4;">+</button></div>
<span style="font-size: 15px; font-weight: 600;">{{deShare}}</span>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600;">Note · facultatif
<input type="text" value="{{deNote}}" onChange="{{setDeNote}}" placeholder="ex. plein avant le départ" style="min-height: 46px; font-size: 16px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); color: #EEF5F4; box-sizing: border-box; width: 100%;"/>
</label>
<button type="button" style="min-height: 52px; background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px dashed rgba(255,255,255,0.35); color: #EEF5F4; font-size: 14px; font-weight: 600;">Photo du reçu</button>
<button type="button" onClick="{{saveExp}}" style="min-height: 52px; background: #C24F1C; color: #FFFFFF; border: 0; font-size: 17px; font-weight: 700;">Enregistrer la dépense</button>
<span style="font-size: 12px; color: #A9BDB9; text-align: center;">Seule votre part est comptée dans vos statistiques. Les reçus restent sur ce téléphone.</span>
</form>
</sc-if>

<!-- ============ ZONE ============ -->
<sc-if value="{{isZone}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<span id="lbl-zmode" style="font-size: 13px; font-weight: 600;">Choix de la zone</span>
<div role="radiogroup" aria-labelledby="lbl-zmode" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid rgba(255,255,255,0.45);">
<sc-for list="{{zoneModeOpts}}" as="u" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="min-height: 56px; border: 0; background: {{u.bg}}; color: {{u.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span style="font-weight: 700; font-size: 15px;">{{u.label}}</span><span style="font-size: 12px; color: {{u.sub}};">{{u.hint}}</span></button>
</sc-for>
</div>
<span style="font-size: 14px;">Zone active : <strong>{{zoneLabel}}</strong> · {{zoneModeLabel}}</span>
</section>
<sc-if value="{{zoneManual}}" hint-placeholder-val="{{false}}">
<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Zones de pêche du Québec</h2>
<div role="radiogroup" aria-label="Zones de pêche" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{zoneBtns}}" as="z" hint-placeholder-count="30">
<button type="button" role="radio" aria-checked="{{z.on}}" aria-label="{{z.aria}}" onClick="{{z.pick}}" style="min-height: 48px; font-size: 15px; font-weight: 700; background: {{z.bg}}; color: {{z.fg}}; border: 1px solid {{z.bd}};">{{z.label}}</button>
</sc-for>
</div>
<a href="https://peche.faune.gouv.qc.ca/RegPec/carteinteractive/fr" target="_blank" rel="noopener" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600;">Pas sûr ? Carte interactive officielle des zones</a>
</section>
</sc-if>
<button onClick="{{goRegl}}" style="min-height: 52px; background: #C24F1C; color: #FFFFFF; border: 0; font-size: 16px; font-weight: 700;">Voir les règlements · {{zoneLabel}}</button>
<span style="font-size: 12px; color: #A9BDB9;">Les limites des zones sont embarquées dans l'app : la détection fonctionne sans réseau.</span>
</div>
</sc-if>

<!-- ============ RÈGLEMENTS ============ -->
<sc-if value="{{isRegl}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px;">
<section style="background: rgba(4,18,22,0.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #FFFFFF; padding: 14px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05;">{{zoneLabel}}</span>
<span style="font-size: 13px; color: #D7E2E0;">Saison 2026-2027 · du 1er avril 2026 au 31 mars 2027</span>
<span style="font-size: 12px; color: #B8C7C4;">Zone {{zoneModeLabel}} · données vérifiées le 6 nov. 2026</span>
<button onClick="{{goZone}}" style="align-self: flex-start; margin-top: 6px; min-height: 40px; padding: 0 12px; background: transparent; border: 1px solid #5B7377; color: #FFFFFF; font-weight: 600; font-size: 14px;">Changer de zone</button>
</section>
<sc-if value="{{seasonExpired}}" hint-placeholder-val="{{false}}">
<section style="background: rgba(226,104,58,0.16); border: 1px solid #C24F1C; padding: 12px 14px; font-size: 14px; font-weight: 600; color: #FFB08A;">Saison terminée : mettez Touladi à jour pour obtenir les règlements de la nouvelle saison.</section>
</sc-if>
<sc-if value="{{reglNoData}}" hint-placeholder-val="{{false}}">
<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
<span style="font-weight: 700; font-size: 16px;">Pas encore dans l'aperçu</span>
<span style="font-size: 14px; color: #A9BDB9;">Cet aperçu contient les zones 3, 13 Est et 13 Ouest. L'app embarquera toutes les zones.</span>
</section>
</sc-if>
<sc-if value="{{reglHasClosed}}" hint-placeholder-val="{{false}}">
<section style="background: rgba(226,104,58,0.16); border: 1px solid #C24F1C; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFB08A;">PÊCHE INTERDITE TOUTE LA SAISON</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{reglClosed}}" as="c" hint-placeholder-count="1"><span style="font-size: 14px; font-weight: 600; padding: 4px 8px; border: 1px solid #C24F1C; background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);">{{c.name}}</span></sc-for>
</div>
</section>
</sc-if>
<sc-for list="{{reglRows}}" as="r" hint-placeholder-count="6">
<article style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
<span style="font-weight: 700; font-size: 16px;">{{r.name}}</span>
<span style="flex-shrink: 0; font-size: 12px; font-weight: 700; padding: 3px 8px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; border: 1px solid {{r.badgeBd}};">{{r.badge}}</span>
</div>
<span style="font-size: 13px; color: #A9BDB9;">{{r.period}}</span>
<span style="font-size: 15px; font-weight: 600;">{{r.limit}}</span>
<sc-if value="{{r.hasSize}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px;">Taille à garder : {{r.size}}</span></sc-if>
<sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #A9BDB9;">{{r.note}}</span></sc-if>
</article>
</sc-for>
<sc-if value="{{reglHasWinter}}" hint-placeholder-val="{{false}}">
<section style="background: rgba(150,205,235,0.13); border: 1px solid rgba(150,205,235,0.32); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Pêche d'hiver</h2>
<sc-for list="{{reglWinter}}" as="w" hint-placeholder-count="2"><span style="font-size: 14px;">{{w.t}}</span></sc-for>
</section>
</sc-if>
<sc-if value="{{hasExc}}" hint-placeholder-val="{{false}}">
<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Plans d'eau avec règles particulières · {{excCount}}</h2>
<span style="font-size: 13px; color: #A9BDB9;">Si votre plan d'eau figure ici, ses règles remplacent celles de la zone. Touladi applique la règle du plan d'eau à vos prises.</span>
<div style="display: flex; flex-direction: column;">
<sc-for list="{{excShown}}" as="e" hint-placeholder-count="8"><span style="font-size: 14px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.10);">{{e.name}}</span></sc-for>
</div>
<sc-if value="{{excMore}}" hint-placeholder-val="{{false}}"><button onClick="{{showAllExc}}" style="align-self: flex-start; min-height: 40px; background: transparent; border: 1px solid rgba(255,255,255,0.45); color: #EEF5F4; padding: 0 12px; font-weight: 600; font-size: 14px;">{{excMoreLabel}}</button></sc-if>
</section>
</sc-if>
<a href="https://peche.faune.gouv.qc.ca/regpec/fr/Info/Reglements" target="_blank" rel="noopener" style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(4,18,22,0.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none;">Source officielle : Pêcher au Québec<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>
<span style="font-size: 12px; color: #A9BDB9;">Touladi résume la réglementation pour vous aider. Seule la source officielle du gouvernement du Québec a valeur légale. Dans les zecs, réserves fauniques et pourvoiries, les règles affichées sur place s'appliquent.</span>
</div>
</sc-if>

<!-- ============ RÉGLAGES ============ -->
<sc-if value="{{isReglages}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 14px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Unités</h2>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-mesures" style="font-size: 13px; font-weight: 600;">Mesures</span>
<div role="radiogroup" aria-labelledby="lbl-mesures" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid rgba(255,255,255,0.45);">
<sc-for list="{{unitOpts}}" as="u" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="min-height: 56px; border: 0; background: {{u.bg}}; color: {{u.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span style="font-weight: 700; font-size: 15px;">{{u.label}}</span><span style="font-size: 12px; color: {{u.sub}};">{{u.hint}}</span></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="lbl-temp" style="font-size: 13px; font-weight: 600;">Température</span>
<div role="radiogroup" aria-labelledby="lbl-temp" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid rgba(255,255,255,0.45);">
<sc-for list="{{tempOpts}}" as="u" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="min-height: 56px; border: 0; background: {{u.bg}}; color: {{u.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span style="font-weight: 700; font-size: 15px;">{{u.label}}</span><span style="font-size: 12px; color: {{u.sub}};">{{u.hint}}</span></button>
</sc-for>
</div>
</div>
</section>
<section style="background: rgba(127,214,202,0.13); border: 1px solid rgba(127,214,202,0.35); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #7FD6CA;">APERÇU</span>
<span style="font-size: 14px;">Prise : {{exCatch}}</span>
<span style="font-size: 14px;">Glace : {{exIce}} · Profondeur : {{exDepth}} · Eau : {{exTemp}}</span>
</section>
<span style="font-size: 12px; color: #A9BDB9;">Par défaut, Touladi parle comme au bord de l'eau : pouces, pieds et livres. Vos données restent enregistrées en métrique : changer d'unité ne modifie que l'affichage. Les tailles légales gardent aussi leur valeur officielle en centimètres.</span>
<span style="font-size: 12px; color: #A9BDB9;">L'équipement garde les unités du commerce (canne 6 pi 6, jig 1/4 oz, fil 10 lb).</span>
<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">Météo</h2>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 600;"><input type="checkbox" checked="{{meteoAuto}}" onChange="{{toggleMeteo}}" style="width: 22px; height: 22px; accent-color: #7FD6CA; flex-shrink: 0;"/>Météo automatique à chaque nouvelle prise</label>
<span style="font-size: 12px; color: #A9BDB9;">Pour obtenir la météo, Touladi envoie seulement une position arrondie (≈ 10 km), jamais vos spots. Sans réseau, la météo est complétée plus tard à partir de la station la plus proche. La phase lunaire est calculée sur le téléphone.</span>
<span style="font-size: 11px; color: #A9BDB9;">Sources : MET Norway (CC BY 4.0) et Environnement et Changement climatique Canada.</span>
</section>
</div>
</sc-if>

<!-- ============ ÉQUIPEMENT ============ -->
<sc-if value="{{isEquip}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;">
<sc-for list="{{gearTabs}}" as="g" hint-placeholder-count="3">
<button onClick="{{g.pick}}" style="flex-shrink: 0; padding: 0 14px; min-height: 42px; font-weight: 600; font-size: 14px; background: {{g.bg}}; color: {{g.fg}}; border: 1px solid {{g.bd}};">{{g.label}}</button>
</sc-for>
</div>
<sc-for list="{{gearShown}}" as="it" hint-placeholder-count="3">
<div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px;">
<div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 700; font-size: 16px;">{{it.name}}</span><span style="font-size: 13px; color: #A9BDB9;">{{it.meta}}</span><span style="font-size: 13px; color: #7FD6CA; font-weight: 600;">{{it.used}}</span></div>
<span style="font-weight: 700; white-space: nowrap;">{{it.value}}</span>
</div>
</sc-for>
<sc-if value="{{gearEmpty}}" hint-placeholder-val="{{false}}"><div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px dashed rgba(255,255,255,0.35); padding: 16px 14px; font-size: 14px; color: #A9BDB9;">Aucun article dans cette catégorie pour l'instant.</div></sc-if>
<button onClick="{{goAjoutEquip}}" style="min-height: 48px; background: #C24F1C; border: 0; color: #FFFFFF; font-weight: 700; font-size: 15px;">Ajouter un article</button>
</div>
</sc-if>

<!-- ============ ENTRETIEN ============ -->
<sc-if value="{{isEntretien}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{maint}}" as="mt" hint-placeholder-count="4">
<label style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); border-left: 0; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start;">
<input type="checkbox" checked="{{mt.done}}" onChange="{{mt.toggle}}" style="width: 22px; height: 22px; margin-top: 2px; accent-color: #7FD6CA; flex-shrink: 0;"/>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 700; font-size: 16px;">{{mt.task}}</span><span style="font-size: 13px; color: #A9BDB9;">{{mt.gear}}</span><span style="font-size: 13px; color: #A9BDB9;">{{mt.rule}} · {{mt.remindTxt}}</span><span style="font-size: 13px; font-weight: 600; color: {{mt.dueColor}};">{{mt.due}}</span></span>
</label>
</sc-for>
<span style="font-size: 12px; color: #A9BDB9;">Cochez quand c'est fait : le prochain entretien se calcule tout seul. Les rappels sont des notifications locales, sans connexion.</span>
<button onClick="{{goAjoutEnt}}" style="min-height: 48px; background: #C24F1C; border: 0; color: #FFFFFF; font-weight: 700; font-size: 15px;">Ajouter un entretien</button>
</div>
</sc-if>

<!-- ============ DÉPENSES ============ -->
<sc-if value="{{isDepenses}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<section style="background: rgba(4,18,22,0.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #FFFFFF; padding: 14px; display: flex; flex-direction: column;"><span style="font-size: 12px; color: #B8C7C4;">Saison 2026</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 1.05;">{{expTotalTxt}}</span><span style="font-size: 13px; color: #D7E2E0;">{{expPerCatch}}</span></section>
<section style="background: rgba(255,255,255,0.07); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{expenses}}" as="ex" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px;">
<span>{{ex.label}}</span><span style="font-weight: 700;">{{ex.amount}}</span>
<div style="grid-column: 1 / span 2; height: 8px; background: rgba(255,255,255,0.10);"><div style="height: 8px; background: #C24F1C; width: {{ex.pct}}%;"></div></div>
</div>

(function () {
  function fit() {
    var bh = document.querySelector('.banner').offsetHeight;
    var s = Math.min(1, window.innerWidth / 390, (window.innerHeight - bh - 36) / 844);
    s = Math.max(s, 0.55);
    var f = document.getElementById('frame');
    f.style.width = (390 * s) + 'px';
    f.style.height = (844 * s) + 'px';
    document.getElementById('app').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(Component));
})();
</script>
